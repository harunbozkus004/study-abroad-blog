<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Anamika Abroad :)</title>
<link href="https://fonts.googleapis.com/css2?family=Sniglet&family=Lato:wght@300;400;700&display=swap" rel="stylesheet"/>
<script src="https://unpkg.com/d3@7.8.5/dist/d3.min.js"></script>
<script src="https://unpkg.com/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="data.js?v=6"></script>
<script src="supabase-client.js"></script>
<script src="tweaks-panel.jsx" type="text/babel"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --pink-50:#fff0f3;--pink-100:#fce4eb;--pink-200:#f8c8d5;--pink-300:#f2a0b8;
  --pink-400:#e87898;--pink-500:#d95878;--pink-600:#c03060;--pink-700:#9a1844;
  --cream:#fffaf8;--white:#fff;
  --gray-100:#f5f0ee;--gray-200:#e8e0dc;--gray-400:#b8a8a2;--gray-600:#7a6460;--gray-900:#2a1a18;
  --gold:#c9a84c;--gold-light:#f0d890;
  --font-display:'Sniglet',cursive;--font-body:'Lato',sans-serif;
}
html,body,#root{height:100%;overflow:hidden;}
body{background:var(--pink-100);font-family:var(--font-body);}

/* ── SCROLLABLE VIEWS ── */
.scroll-view{
  height:100%;overflow-y:auto;padding:26px 44px 40px;
  scrollbar-width:thin;scrollbar-color:var(--pink-300) transparent;
}
.scroll-view::-webkit-scrollbar{width:5px;}
.scroll-view::-webkit-scrollbar-thumb{background:var(--pink-300);border-radius:9999px;}

.post-detail-view{padding:28px 44px 60px;}

/* ── VIEW HEADER ── */
.view-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;flex-wrap:wrap;gap:10px;}
.view-title{font-family:var(--font-display);font-size:30px;color:var(--pink-600);}

/* ── ARCHIVE GRID ── */
.archive-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px;}
.archive-card{
  background:rgba(255,255,255,.88);border:2px solid var(--pink-400);border-radius:18px;
  padding:16px;cursor:pointer;
  box-shadow:0 2px 10px rgba(200,100,120,.10);
  transition:box-shadow .2s,transform .2s;
}
.archive-card:hover{box-shadow:0 6px 22px rgba(200,100,120,.22);transform:translateY(-2px);}
.archive-card-img{
  background:linear-gradient(135deg,#f8c8d5,#fce4eb);
  border-radius:10px;height:120px;display:flex;align-items:center;justify-content:center;margin-bottom:12px;
}

/* ── MASONRY ── */
.masonry-board{columns:220px;column-gap:18px;}
.masonry-item{break-inside:avoid;margin-bottom:18px;}
.masonry-item:hover .masonry-ph-inner{transform:scale(1.03);}

/* ── MODALS ── */
.modal-overlay{
  position:fixed;inset:0;z-index:1000;background:rgba(42,26,24,.4);
  backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:16px;
}
.modal-card{
  background:var(--cream);border:2px solid var(--pink-300);border-radius:22px;
  width:100%;max-width:540px;max-height:88vh;display:flex;flex-direction:column;
  box-shadow:0 12px 48px rgba(200,100,120,.25);overflow:hidden;
}
.modal-hd{
  display:flex;align-items:center;justify-content:space-between;
  padding:16px 20px;border-bottom:1.5px solid var(--pink-200);flex-shrink:0;
}
.modal-body{padding:18px 20px;overflow-y:auto;flex:1;scrollbar-width:thin;scrollbar-color:var(--pink-300) transparent;}
.modal-ft{padding:14px 20px;border-top:1.5px solid var(--pink-200);display:flex;gap:10px;justify-content:flex-end;flex-shrink:0;}
.modal-x{background:none;border:none;cursor:pointer;font-size:16px;color:var(--gray-600);padding:4px;border-radius:6px;transition:color .15s;}
.modal-x:hover{color:var(--pink-600);}

/* ── FORM ELEMENTS ── */
.form-field{margin-bottom:14px;}
.form-label{display:block;font-family:var(--font-display);font-size:12px;color:var(--pink-600);margin-bottom:5px;letter-spacing:.03em;}
.form-input{
  width:100%;height:38px;padding:0 12px;
  border:1.5px solid var(--pink-300);border-radius:9px;
  font-family:var(--font-body);font-size:13.5px;color:var(--gray-900);
  background:rgba(255,255,255,.9);outline:none;transition:border-color .15s;
}
.form-input:focus{border-color:var(--pink-500);}
.form-textarea{
  width:100%;padding:10px 12px;
  border:1.5px solid var(--pink-300);border-radius:9px;
  font-family:var(--font-body);font-size:13.5px;color:var(--gray-900);
  background:rgba(255,255,255,.9);outline:none;resize:vertical;transition:border-color .15s;line-height:1.6;
}
.form-textarea:focus{border-color:var(--pink-500);}
.form-select{
  width:100%;height:38px;padding:0 12px;
  border:1.5px solid var(--pink-300);border-radius:9px;
  font-family:var(--font-body);font-size:13.5px;color:var(--gray-900);
  background:rgba(255,255,255,.9);outline:none;cursor:pointer;
}

/* ── BUTTONS ── */
.btn-pri{
  font-family:var(--font-display);font-size:14px;background:var(--pink-500);color:white;
  border:none;border-radius:9999px;padding:8px 20px;cursor:pointer;
  transition:box-shadow .15s,transform .15s;
  box-shadow:0 2px 8px rgba(200,100,120,.2);
}
.btn-pri:hover{box-shadow:0 4px 16px rgba(200,100,120,.3);transform:translateY(-1px);}
.btn-sec{
  font-family:var(--font-display);font-size:14px;background:rgba(255,255,255,.7);color:var(--pink-600);
  border:1.5px solid var(--pink-300);border-radius:9999px;padding:8px 20px;cursor:pointer;
  transition:background .15s;
}
.btn-sec:hover{background:var(--pink-100);}

/* ── BACKGROUND DECORATION ── */
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(ellipse 60% 40% at 10% 90%, rgba(242,160,184,.14) 0%, transparent 70%),
    radial-gradient(ellipse 40% 50% at 90% 10%, rgba(217,88,120,.10) 0%, transparent 70%);
}
#root{position:relative;z-index:1;}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="Globe.jsx"></script>
<script type="text/babel" src="Modals.jsx"></script>
<script type="text/babel" src="App.jsx"></script>
</body>
</html>
